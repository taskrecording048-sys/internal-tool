name: CI

on:
  push:
    branches:
      - 'main/**'

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: pip install flake8
      - name: Run flake8
        run: flake8 app.py test_app.py --max-line-length=100
